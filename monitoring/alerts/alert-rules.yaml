apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-alert-rules
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: kubernetes.rules
      rules:
        - alert: HighCPUUsage
          expr: sum(rate(container_cpu_usage_seconds_total{namespace="default"}[5m])) by (pod) > 0.1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage detected"
            description: "Pod {{ $labels.pod }} CPU usage is above threshold"

        - alert: PodRestartingTooMuch
          expr: rate(kube_pod_container_status_restarts_total{namespace="default"}[15m]) * 60 * 15 > 3
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Pod restarting too frequently"
            description: "Pod {{ $labels.pod }} has restarted more than 3 times in 15 minutes"

        - alert: HighMemoryUsage
          expr: sum(container_memory_usage_bytes{namespace="default"}) by (pod) > 100000000
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage detected"
            description: "Pod {{ $labels.pod }} memory usage is above 100MB"